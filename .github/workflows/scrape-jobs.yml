name: Scrape Jobs

# v5.1 — identical to your current workflow except:
#   1. Checkout uses GH_PAT so the bot's push triggers the Azure SWA deploy
#      (root cause of the April–July stale-site freeze)
#   2. "Verify output" upgraded: fails loudly on suspiciously low counts /
#      zeroed sources, and writes a per-source summary to the Actions UI
# Everything else (env names, requirements.txt, cache files, push retry)
# is preserved from your working version.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/scraper.py'
      - '.github/workflows/scrape-jobs.yml'
      - 'requirements.txt'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}   # <-- the fix: PAT pushes trigger Azure deploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run scraper
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_EMAIL: ${{ secrets.USAJOBS_USER_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          THE_MUSE_API_KEY: ${{ secrets.THE_MUSE_API_KEY }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
          CAREERONESTOP_API_TOKEN: ${{ secrets.CAREERONESTOP_API_TOKEN }}
        run: python .github/scripts/scraper.py

      - name: Validate output (fail loudly on broken data)
        run: |
          python - <<'EOF'
          import json, sys
          from datetime import datetime, timezone

          MIN_ACCEPTABLE_JOBS = 500   # healthy runs land ~3,000+

          with open('public/data/jobs.json') as f:
              data = json.load(f)

          jobs = data.get('jobs', [])
          meta = data.get('meta', {})
          sources = meta.get('sources', {})

          print(f"Total jobs: {len(jobs)}")
          for src, n in sorted(sources.items(), key=lambda x: -x[1]):
              flag = '  <-- ZERO! check this source/key' if n == 0 else ''
              print(f"  {src}: {n}{flag}")

          if len(jobs) < MIN_ACCEPTABLE_JOBS:
              print(f"::error::Only {len(jobs)} jobs scraped "
                    f"(minimum {MIN_ACCEPTABLE_JOBS}). Refusing to publish — "
                    f"likely an expired API key or broken source.")
              sys.exit(1)

          with open('summary.md', 'w') as s:
              now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M')
              s.write(f"## Scrape summary — {now} UTC\n\n")
              s.write(f"**{len(jobs):,} jobs** written to jobs.json | "
                      f"geocoded: {meta.get('geocoded_count', '?')} | "
                      f"federal: {meta.get('federal_count', '?')}\n\n")
              s.write("| Source | Jobs |\n|---|---|\n")
              for src, n in sorted(sources.items(), key=lambda x: -x[1]):
                  s.write(f"| {src} | {n:,} |\n")
          EOF
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updates
        run: |
          git config user.name "cyberroadmap-bot"
          git config user.email "actions@github.com"

          # Stage all the files the scraper writes
          git add public/data/jobs.json
          if [ -f public/data/location_cache.json ]; then
            git add public/data/location_cache.json
          fi
          if [ -f .theirstack_last_run ]; then
            git add .theirstack_last_run
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update jobs.json + location cache [automated]"

            # Retry push with rebase to handle concurrent commits
            for i in 1 2 3; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            echo "Push complete"
          fi
