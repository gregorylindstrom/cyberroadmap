<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Packet Capture — the monthly cybersecurity student newsletter. This link always shows the newest issue; past issues are archived here.">
    <title>Packet Capture — Monthly Newsletter | CyberRoadmap</title>
    <link rel="canonical" href="https://www.cyberroadmap.org/newsletter.html">
    <meta property="og:title" content="Packet Capture — Monthly Cybersecurity Newsletter">
    <meta property="og:description" content="Program news, career advice, events, and puzzles — a new issue every month. Bookmark this page: it always shows the latest.">
    <meta property="og:url" content="https://www.cyberroadmap.org/newsletter.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CyberRoadmap">
    <meta name="twitter:card" content="summary">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0a0e14;
            --paper: #f4f1ea;
            --accent: #ff4a1c;
            --muted: #6b7280;
            --line: rgba(244, 241, 234, 0.12);
            --line-strong: rgba(244, 241, 234, 0.28);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--ink);
            color: var(--paper);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
        }

        nav {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 0.6rem;
            flex-shrink: 0;
        }
        .logo {
            font-size: 0.85rem; font-weight: 700; letter-spacing: 0.05em;
            text-transform: uppercase; text-decoration: none; color: var(--paper);
        }
        .logo .bracket { color: var(--accent); }
        .nav-links {
            display: flex; gap: 1.4rem;
            font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
            flex-wrap: wrap;
        }
        .nav-links a { color: var(--muted); text-decoration: none; }
        .nav-links a:hover { color: var(--paper); }

        .issue-bar {
            padding: 0.7rem 2rem;
            border-bottom: 1px solid var(--line-strong);
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
            flex-shrink: 0;
        }
        .issue-bar .nl-name {
            font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--accent);
        }
        .issue-bar label {
            font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--muted);
        }
        select#issue-select {
            background: var(--ink); color: var(--paper);
            border: 1px solid var(--line-strong);
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            padding: 0.35rem 0.6rem; cursor: pointer;
        }
        select#issue-select:focus { outline: 1px solid var(--accent); }
        .bar-links { margin-left: auto; display: flex; gap: 1.2rem; }
        .bar-links a {
            font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--muted); text-decoration: none;
            border-bottom: 1px solid transparent; padding-bottom: 1px;
        }
        .bar-links a:hover { color: var(--accent); border-color: var(--accent); }

        .frame-wrap { flex: 1; min-height: 0; background: #F4F5F7; }
        iframe#issue-frame {
            width: 100%; height: 100%; border: 0; display: block;
            background: #F4F5F7;
        }
        .msg {
            padding: 2rem; font-size: 0.85rem; color: var(--muted); line-height: 1.7;
        }
        .msg a { color: var(--accent); }

        @media (max-width: 600px) {
            nav, .issue-bar { padding-left: 1rem; padding-right: 1rem; }
            .nav-links { gap: 0.9rem; }
            .bar-links { margin-left: 0; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo"><span class="bracket">&lt;</span>CYBERROADMAP<span class="bracket">/&gt;</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/jobs.html">Jobs</a>
            <a href="/certs.html">Certs</a>
            <a href="/training.html">Training</a>
            <a href="/scholarships.html">Scholarships</a>
            <a href="/resources.html">Resources</a>
        </div>
    </nav>

    <div class="issue-bar">
        <span class="nl-name">Packet Capture</span>
        <label for="issue-select">Issue:</label>
        <select id="issue-select" aria-label="Choose an issue"></select>
        <div class="bar-links">
            <a id="direct-link" href="#" target="_blank" rel="noopener">Open full page ↗</a>
        </div>
    </div>

    <div class="frame-wrap">
        <iframe id="issue-frame" title="Newsletter issue"></iframe>
    </div>

    <noscript>
        <div class="msg">
            This page needs JavaScript to load the current issue automatically.
            You can open issues directly: <a href="/newsletters/2026-11.html">November 2026 (Issue 1)</a>.
        </div>
    </noscript>

    <script>
    // Stable-URL newsletter shell.
    // /newsletter.html always shows the NEWEST issue (first entry in issues.json).
    // /newsletter.html?issue=2026-11 shows a specific archived issue — those links
    // are permanent too, so "see last month's puzzle solutions" is one URL away.
    (async () => {
        const frame = document.getElementById('issue-frame');
        const select = document.getElementById('issue-select');
        const direct = document.getElementById('direct-link');
        const ID_RE = /^\d{4}-\d{2}$/;   // only allow IDs shaped like 2026-11

        let manifest;
        try {
            const r = await fetch('/newsletters/issues.json?t=' + Date.now(), { cache: 'no-cache' });
            manifest = await r.json();
        } catch (e) {
            document.querySelector('.frame-wrap').innerHTML =
                '<div class="msg">Couldn’t load the issue list. Try refreshing — or open the latest issue directly at <a href="/newsletters/2026-11.html">/newsletters/2026-11.html</a>.</div>';
            return;
        }

        const issues = (manifest.issues || []).filter(i => ID_RE.test(i.id));
        if (!issues.length) return;

        // Which issue? URL param if valid, else the newest (first in the list).
        const param = new URLSearchParams(location.search).get('issue');
        const current = issues.find(i => i.id === param) || issues[0];

        // Populate the archive selector
        select.innerHTML = issues.map(i =>
            `<option value="${i.id}"${i.id === current.id ? ' selected' : ''}>${i.label}${i.id === issues[0].id ? ' — latest' : ''}</option>`
        ).join('');

        function load(issue) {
            const src = '/newsletters/' + issue.id + '.html';
            frame.src = src;
            direct.href = src;
            document.title = `Packet Capture — ${issue.label.split(' · ')[0]} | CyberRoadmap`;
            // Keep the URL shareable: latest = clean URL, archive = ?issue=
            const url = issue.id === issues[0].id ? '/newsletter.html' : '/newsletter.html?issue=' + issue.id;
            history.replaceState(null, '', url);
        }

        select.addEventListener('change', () => {
            const issue = issues.find(i => i.id === select.value);
            if (issue) load(issue);
        });

        load(current);
    })();
    </script>

</body>
</html>
